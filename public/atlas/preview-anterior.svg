        <feFlood flood-color="#4a3224" flood-opacity="0.92" result="ink"/>
        <feComposite in="ink" in2="ring" operator="in"/>
      </filter>
      <filter id="fig-soft" x="-20%" y="-20%" width="140%" height="140%">
