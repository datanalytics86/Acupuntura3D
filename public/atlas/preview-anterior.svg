        <stop offset="100%" stop-color="#f6e3d0" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="pubis-skin" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C89661"/>
        <stop offset="72%" stop-color="#C89661"/>
        <stop offset="100%" stop-color="#A67A52"/>
      </linearGradient>
      <mask id="fig-skin" maskUnits="userSpaceOnUse">
