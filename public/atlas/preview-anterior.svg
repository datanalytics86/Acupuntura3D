<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1680" width="800" height="1680">
  <rect width="800" height="1680" fill="#E7DCC4"/>
  <rect x="28" y="28" width="744" height="1624" fill="#F3EBD8" stroke="#c4b089" stroke-width="1"/>
