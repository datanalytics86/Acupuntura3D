  <text x="400" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#3a2a1c">Cuerpo humano — vista anterior</text>
  <line x1="330" y1="92" x2="470" y2="92" stroke="#c4b089" stroke-width="1"/>
  <g transform="translate(0 70)">
    <defs>
      <filter id="fig-grade" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0.90 0.07 0.02 0 0.02  0.03 0.88 0.04 0 0.012  0.02 0.05 0.76 0 0  0 0 0 1 0"/>
      </filter>
      <filter id="fig-ink" x="-4%" y="-2%" width="108%" height="104%" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="1.35" result="edge"/>
